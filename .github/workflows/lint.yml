name: lint

on:
  push:
  pull_request:

# Шаги с shell: powershell — только ASCII: GitHub сохраняет их во временный .ps1 без BOM,
# и Windows PowerShell 5.1 прочитает кириллицу как ANSI. Проверки с кириллицей — в tests/*.ps1 (UTF-8 с BOM).

jobs:
  windows:
    name: Windows PowerShell 5.1 на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $r = @('windows/inventory.ps1', 'tests/check-windows.ps1') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          $r | Format-Table ScriptName, Severity, Line, RuleName, Message -AutoSize -Wrap
          if ($r) { exit 1 }

      - name: UTF-8 with BOM and PS 5.1 syntax
        shell: powershell
        run: |
          foreach ($f in 'windows/inventory.ps1', 'tests/check-windows.ps1') {
            $b = [IO.File]::ReadAllBytes($f)
            if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { Write-Error "$f must be UTF-8 with BOM"; exit 1 }
            $errs = $null
            [void][Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { "$f $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }

      - name: Accuracy check (tests/check-windows.ps1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/check-windows.ps1

      - name: Full report for review
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File windows/inventory.ps1 -Owner company -SkipWU -Config config.example.json

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck -S warning linux/inventory.sh tests/check-linux.sh macos/inventory.sh tests/check-macos.sh

  macos:
    name: проверка на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис для системного bash 3.2
        run: /bin/bash --version | head -1 && /bin/bash -n macos/inventory.sh && /bin/bash -n tests/check-macos.sh
      - name: Проверка достоверности без sudo
        run: /bin/bash tests/check-macos.sh
      - name: Проверка достоверности под sudo
        run: sudo /bin/bash tests/check-macos.sh
      - name: Конфиг через jq и через plutil (Mac без jq)
        run: |
          /bin/bash macos/inventory.sh --owner company --skip-updates --config config.example.json | tee /tmp/jq.txt
          grep -q 'разобран через jq' /tmp/jq.txt
          mkdir -p /tmp/nojq && printf '#!/bin/sh\nexit 1\n' > /tmp/nojq/jq && chmod +x /tmp/nojq/jq
          PATH=/tmp/nojq:$PATH /bin/bash macos/inventory.sh --owner company --skip-updates --config config.example.json | tee /tmp/plutil.txt
          grep -q 'разобран через plutil' /tmp/plutil.txt
          grep -q 'Контроллеры домена' /tmp/plutil.txt
      - name: Проверка достоверности на Mac без jq (чтение отчёта через osascript)
        run: PATH=/tmp/nojq:$PATH /bin/bash tests/check-macos.sh
      - name: Сырые данные об устройствах ввода (для сверки с разделом «Клавиатура и мышь»)
        run: ioreg -r -c IOHIDDevice -l -w0 -d 1 | grep -E '^\+-o|"(Product|Manufacturer|Transport|Built-In|PrimaryUsagePage|PrimaryUsage|VendorID)" =' || true
      - name: Полный отчёт для просмотра (с softwareupdate)
        run: /bin/bash macos/inventory.sh --owner company --config config.example.json

  linux-vm:
    name: проверка на виртуалке ${{ matrix.os }} (root)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Необязательные утилиты
        run: sudo apt-get update -qq && sudo apt-get install -y -qq smartmontools jq >/dev/null
      - name: Проверка достоверности (tests/check-linux.sh)
        run: sudo bash tests/check-linux.sh --strict
      - name: Полный отчёт для просмотра
        run: sudo bash linux/inventory.sh --owner company --config config.example.json
      - name: Сырые данные об устройствах ввода (для сверки с разделом «Клавиатура и мышь»)
        run: cat /proc/bus/input/devices || true

  linux-container:
    name: пробный запуск в ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Голый контейнер — без конфига, без jq и python3
        run: |
          bash linux/inventory.sh --owner company --skip-updates --json /tmp/r0.json --csv /tmp/r0.csv
          test -s /tmp/r0.json && test -s /tmp/r0.csv
          bash linux/inventory.sh --owner company --config config.example.json --skip-updates | tee /tmp/out0.txt
          grep -q 'Нет ни jq, ни python3' /tmp/out0.txt

      - name: Конфиг через python3
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
          bash linux/inventory.sh --owner company --config config.example.json --json /tmp/r1.json | tee /tmp/out1.txt
          grep -q 'разобран через python3' /tmp/out1.txt
          python3 -c 'import json; d = json.load(open("/tmp/r1.json")); assert d["configUsed"] and d["details"], d'

      - name: Конфиг через jq
        run: |
          apt-get install -y -qq --no-install-recommends jq >/dev/null
          bash linux/inventory.sh --owner company --config config.example.json --skip-updates --json /tmp/r2.json | tee /tmp/out2.txt
          grep -q 'разобран через jq' /tmp/out2.txt
          jq -e '.configUsed == true and (.details | length) > 10' /tmp/r2.json >/dev/null

      - name: Проверка достоверности (tests/check-linux.sh)
        run: bash tests/check-linux.sh
