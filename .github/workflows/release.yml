name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия в скриптах совпадает с тегом
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qF "\$ScriptVersion = '$v'" windows/inventory.ps1 || { echo "::error::в windows/inventory.ps1 не версия $v"; exit 1; }
          grep -qF "VERSION='$v'" linux/inventory.sh || { echo "::error::в linux/inventory.sh не версия $v"; exit 1; }
          grep -qF "VERSION='$v'" macos/inventory.sh || { echo "::error::в macos/inventory.sh не версия $v"; exit 1; }

      - name: Файлы и SHA256SUMS
        run: |
          mkdir dist
          cp windows/inventory.ps1 linux/inventory.sh dist/
          cp macos/inventory.sh dist/inventory-macos.sh
          cd dist && sha256sum inventory.ps1 inventory.sh inventory-macos.sh > SHA256SUMS && cat SHA256SUMS

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
